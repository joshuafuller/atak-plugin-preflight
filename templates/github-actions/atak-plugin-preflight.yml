# Copy this file and preflight.py into an ATAK plugin repository as
# .github/workflows/atak-plugin-preflight.yml. It performs source checks only:
# no APK signing, TPP credentials, or ATAK SDK secrets are required.
name: ATAK source preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.161.0'
      - name: Install pinned Trivy
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.69.1/trivy_0.69.1_Linux-64bit.tar.gz \
            | tar -xz -C /usr/local/bin trivy
      - name: Install OSV-Scanner
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Run source preflight
        run: python preflight.py . --json | tee preflight.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atak-source-preflight
          path: reports/
